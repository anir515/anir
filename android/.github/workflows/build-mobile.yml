name: Build Android Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK Release Asset
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-assets
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} "dist-assets/Mori-v${VERSION}-Android.apk" \;

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mori-Android-APK
          path: dist-assets/*.apk

      - name: Upload Release Asset (Android)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
